<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!--    <meta http-equiv="Content-Security-Policy" content="default-src http: https:;">-->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <style> #downloadMicro { position: fixed; top: 150px; right: 0px; width: 70px; height: 50px; background-color: #4caf4f60; color: white; text-align: center; line-height: 50px; transition: 0.5s; } </style>
    <style>
      /* 弹窗样式 */
      .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.4); /* 背景透明度 */
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
      }
      .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        max-width: 90%; /* 最大宽度 */
        max-height: 90%; /* 最大高度 */
        overflow: auto; /* 内容超出时添加滚动条 */
      }
      .close {
        position: absolute;
        top: 10px;
        right: 20px;
        color: #aaa;
        font-size: 28px;
        font-weight: bold;
      }
      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1" style="width: {{{ WIDTH }}}px; height: {{{ HEIGHT }}}px; background: url('bg.png') no-repeat center center;
      background-size: cover;"></canvas>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="dynamic_loader.js"></script>
    <script>
      mASKJLoader.Load()
    </script>

    <div id="downloadMicro" style="display: none" onclick="SDKHelper.ClickDownload()">
      <img src="downloadMicro.png" style="width:50px;height:50px;">
    </div>

    <!-- 弹窗 -->
    <div id="myModal" class="modal">
      <div id="modalContent" class="modal-content">
        <span class="close" onclick="closePopup()">&times;</span>
        <div id="popupContent"></div>
      </div>
    </div>

    <script>
      // if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      //}

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "https://res-news-dtry.oclkj.com/webgl_release_unity6/StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {window.unityInstance = unityInstance});
    </script>

    <script>
      function OpenUrl_Window(url, qrcodeUrl, height, width, price, html, cb) {
        var modal = document.getElementById("myModal");
        var content = document.getElementById("popupContent");
        var modalContent = document.getElementById("modalContent");
        if (url != "")
        {
          var tarWidth = (width != null) ? width : 400; 
          var tarHeight = (height != null) ? height : 400;
          content.innerHTML = '<iframe src="' + url + '" width="'+tarWidth+'px" height="'+tarHeight+'px"></iframe>';
          content.style.maxWidth = (width == null) ? "none" : (tarWidth + "px");
          modalContent.style.maxWidth = (width == null) ? "none" : (tarWidth + "px");
          modal.style.display = "flex";
        }
        else if (qrcodeUrl != "")
        {
          content.innerHTML = "";
          new QRCode(content, {
            text: qrcodeUrl,
            width: 256,
            height: 256
          });
          modalContent.style.maxWidth = "256px"; // 设置最大宽度为256px
          modal.style.display = "block";
        }else{

          content.innerHTML = html
          modal.style.display = "flex"; // 使用 flex 布局
        }
        if (cb != null) {
          cb()
        }
      }
      function closePopup() {
        var modal = document.getElementById("myModal");
        modal.style.display = "none";
      }

      // 点击弹窗外部关闭弹窗
      window.onclick = function(event) {
        var modal = document.getElementById("myModal");
        if (event.target == modal) {
          modal.style.display = "none";
        }
      }
    </script>
  </body>
</html>
